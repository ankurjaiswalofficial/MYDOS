[project]
name = "fastapi-uv"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The project root on sys.path, so `tests/` can import `app` without the package
# being installed. A `--bare` uv project has no build backend and nothing to
# install, which is correct for a service — it is run, not imported by others.
pythonpath = ["."]

[tool.ruff]
line-length = 100
# Generated by `alembic revision --autogenerate`, reviewed but not hand-styled;
# these are not code this project's linting conventions apply to.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
